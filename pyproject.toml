[project]
name = "pUnit"
version = "0.0.0"
description = "..a modernized unit-test framework for Python."
keywords = ["test", "unittest", "unit-test", "xUnit", "nUnit", "pytest", "mock", "patch", "parallelism", "vscode", "vscodium"]
authors = [
    { name="Shaun Wilson", email="mrshaunwilson@msn.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]
dependencies = [
]

[dependency-groups]
dev = [
    "coverage",
    "mypy",
    "py-conventional-semver (>=2.0.0)"
]

[project.urls]
Documentation = "https://punit.readthedocs.io/"
Homepage = "https://github.com/wilson0x4d/punit"
Repository = "https://github.com/wilson0x4d/punit.git"

[project.scripts]
punit = "punit.__main__:main"

[tool.setuptools.package-data]
"punit" = ["py.typed", "SKILL.md"]

[tool.uv]
package = true
